[project]
name = "hyperdither"
version = "0.1.0"
description = "Atkinson dithering for images"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "numba>=0.68",
    "numpy>=2",
    "pillow>=11",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
